# Render Blueprint for CivicSpark AI Backend
# Deploy: Connect repo at https://dashboard.render.com/select-repo?type=blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# The database is a free Supabase Postgres project (pgvector enabled).
# Set DATABASE_URL to the Supabase *session pooler* connection string
# (Project Settings -> Database -> Connection pooling). Direct connections
# are IPv6-only on the Supabase free tier and will not work from Render.

services:
  - type: web
    name: civicspark-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GEOCODIO_API_KEY
        sync: false
      - key: INGEST_API_TOKEN
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://civicspark-ai.vercel.app"]'
