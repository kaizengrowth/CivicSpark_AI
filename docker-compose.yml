services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: civicspark_postgres
    environment:
      POSTGRES_DB: civicspark_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - civicspark_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicspark_backend
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/civicspark_db
      - SECRET_KEY=your-secret-key-for-development
      - ENVIRONMENT=development
      - DEBUG=True
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - /app/venv
    depends_on:
      - postgres
    networks:
      - civicspark_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicspark_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - civicspark_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  civicspark_network:
    driver: bridge
