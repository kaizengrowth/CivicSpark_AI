version: '3.8'

# Local development stack: one database, one API, one frontend.
# Postgres (with pgvector) is the only stateful service — it also holds
# the RAG vector index, so there is no Redis/Celery/vector-DB sidecar.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: civicspark_postgres
    environment:
      POSTGRES_DB: citycamp_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - civicspark_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d citycamp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicspark_backend
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/citycamp_db
      - SECRET_KEY=dev-secret-key-not-for-production
      - ENVIRONMENT=development
      - DEBUG=True
      - STORAGE_DIR=/app/storage
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - civicspark_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicspark_frontend
    ports:
      - "3002:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - civicspark_network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage:

networks:
  civicspark_network:
    driver: bridge
