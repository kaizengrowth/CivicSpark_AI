version: '3.8'

# Self-hosted production stack (alternative to Render + Vercel).
# Same shape as development: one database, one API.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: civicspark_backend_prod
    environment:
      - DATABASE_URL=postgresql://user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/citycamp_db
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY}
      - ENVIRONMENT=production
      - DEBUG=False
      - STORAGE_DIR=/app/storage
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - postgres
    networks:
      - civicspark_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    container_name: civicspark_postgres_prod
    environment:
      POSTGRES_DB: citycamp_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - civicspark_network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage:

networks:
  civicspark_network:
    driver: bridge
